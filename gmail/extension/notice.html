<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in for Claude</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #202124; --muted: #5f6368; --accent: #1a73e8; }
  @media (prefers-color-scheme: dark) { :root { --bg: #202124; --fg: #e8eaed; --muted: #9aa0a6; --accent: #8ab4f8; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 32rem; margin: 15vh auto 0; padding: 0 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 .75rem; }
  p { margin: 0 0 1rem; }
  #account { font-weight: 600; overflow-wrap: anywhere; }
  a.button { display: inline-block; margin: .5rem 0 1.5rem; padding: .6rem 1.5rem; border-radius: 4px; background: var(--accent); color: var(--bg); font-weight: 600; text-decoration: none; }
  .note { color: var(--muted); font-size: .875rem; }
</style>
</head>
<body>
<main>
  <h1>Sign in to Google for Claude</h1>
  <p>Claude cannot reach your Google account <span id="account"></span>. Sign in with this account in this Chrome profile.</p>
  <a class="button" id="signin" target="_blank">Sign in</a>
  <p class="note">After you sign in, come back to this tab. It closes, and the red mark on the extension icon goes away, when Claude can reach your account.</p>
</main>
<script type="module" src="notice.js"></script>
</body>
</html>
